# Runs the simulator's unit tests, and checks that a pull request keeps the results of
# the shipped scenarios (simulator/bin/check_scenarios.py).
name: simulator

on:
  pull_request:
    paths: ["simulator/**", ".github/workflows/simulator.yml"]
  push:
    branches: [main]
    paths: ["simulator/**", ".github/workflows/simulator.yml"]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: simulator/requirements.txt
      - run: pip install -r simulator/requirements.txt pytest
      - run: python -m pytest -q
        working-directory: simulator
        env:
          PYTHONPATH: src

  shipped-scenarios:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: simulator/requirements.txt
      - run: pip install -r simulator/requirements.txt
      # The code of the branch the pull request goes into, next to the pull request itself.
      - run: git worktree add "$RUNNER_TEMP/base" "${{ github.event.pull_request.base.sha }}"
      - run: python simulator/bin/check_scenarios.py "$RUNNER_TEMP/base" .
